# A generic, single database configuration.

[alembic]
script_location = migrations
prepend_sys_path = .

# Use correct DB for Green Street project
sqlalchemy.url = sqlite:///green_street.db

# Use OS-specific path separator
version_path_separator = os

[post_write_hooks]
# Example: black/ruff formatters can be added here

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
